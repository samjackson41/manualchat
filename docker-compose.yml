# ManualChat — two services, started one-per-terminal (never `docker compose up`
# all-in-one, never detached). The secrets OPENROUTER_API_KEY and
# LANGSMITH_API_KEY are passed through from the host shell; never stored here.

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # Passed through from the host shell. Never hardcoded or committed.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # LangSmith tracing (MVP+1 monitoring). Optional; set LANGSMITH_TRACING
      # and LANGSMITH_API_KEY in the host shell to record runs (backend/config.py).
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
      - LANGSMITH_PROJECT=${LANGSMITH_PROJECT:-manualchat}
      - LANGSMITH_ENDPOINT=${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      # Manuals and vehicles persist on the host (DECISIONS U1); see the mounts.
      - MANUALS_DIR=/data/manuals
      - VEHICLES_DIR=/data/vehicles
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the package source (`backend/` == the importable package) to
      # /app/backend so `import backend` resolves (PYTHONPATH=/app). The image's
      # /app/.venv sits OUTSIDE this mount and survives; uvicorn --reload watches
      # the mounted source for hot reload.
      - ./backend:/app/backend
      # Uploaded manuals live in the host's `manuals/` dir and survive rebuilds.
      - ./manuals:/data/manuals
      # Vehicle profiles live in the host's `vehicles/` dir and survive rebuilds.
      - ./vehicles:/data/vehicles
      # The embedded Qdrant index lives in the host's `qdrant/` dir and survives
      # rebuilds (gitignored; never committed).
      - ./qdrant:/app/qdrant

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      # Cache-busted at build; the browser reads this at runtime to find the API.
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # Anonymous volume preserves the image's node_modules across the mount.
      - /app/node_modules
      # Keeps the dev server's build output off the host copy, so a host-side
      # `next build` cannot delete the assets a running dev server serves.
      - /app/.next