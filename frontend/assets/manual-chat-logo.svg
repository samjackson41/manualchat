<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Wrench inside a chat bubble" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Wrench in a chat bubble</title>
  <defs>
    <mask id="wrenchMask" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <!-- open jaw -->
      <path d="M232 86 H280 V138 a24 24 0 0 1 -48 0 Z" fill="#000"/>
      <!-- hole in handle end -->
      <circle cx="256" cy="320" r="11" fill="#000"/>
    </mask>
  </defs>

  <!-- chat bubble -->
  <path d="M128 64 H384 A72 72 0 0 1 456 136 V322 A72 72 0 0 1 384 394 H200 L120 458 L140 394 H128 A72 72 0 0 1 56 322 V136 A72 72 0 0 1 128 64 Z"
        fill="#FFFFFF" stroke="#000000" stroke-width="14" stroke-linejoin="round"/>

  <!-- wrench -->
  <g transform="rotate(45 256 229)" mask="url(#wrenchMask)" fill="#6B7280">
    <circle cx="256" cy="154" r="56"/>
    <rect x="238" y="190" width="36" height="130"/>
    <circle cx="256" cy="320" r="30"/>
  </g>
</svg>
