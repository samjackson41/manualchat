[project]
name = "manualchat-backend"
version = "0.1.0"
description = "ManualChat grounded repair-manual assistant — backend skeleton"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.32",
    "docling>=2.52.0",
    "pymupdf>=1.28.2",
    "torch>=2.14",
    "torchvision>=0.29",
    "tiktoken>=0.14.0",
    "sentence-transformers>=6.1.0",
    "qdrant-client>=1.19.1",
    "langsmith>=0.14.0",
]

# This project is NOT itself installed as a package — the `backend/` source is
# bind-mounted for hot reload. `uv sync` only installs the dependencies above.
[tool.uv]
package = false

# CPU-only torch/torchvision (no CUDA). Revisit when scanned-manual OCR lands
# (DECISIONS S1) and a GPU host is in play.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

# Tests import the `backend` package, which lives one directory up.
# The `heavy` retrieval test downloads models and stays out of the default run
# (DECISIONS T2/T3); run it alone with `uv run pytest -m heavy`.
[tool.pytest.ini_options]
pythonpath = [".."]
addopts = "-m 'not heavy'"
markers = ["heavy: end-to-end retrieval; downloads models"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
